name: Supabase Keep-Alive & Health Ping

on:
  schedule:
    # Runs every 2 days at 04:00 UTC (keeps Supabase active well within the 7-day pause window)
    - cron: '0 4 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping:
    name: Ping Health Endpoint & Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Ping Live Application Health Check
        env:
          APP_URL: ${{ secrets.APP_URL || secrets.NEXT_PUBLIC_APP_URL }}
        run: |
          TARGET_URL="${APP_URL:-https://your-app-domain.vercel.app}/api/health"
          echo "Pinging health endpoint: $TARGET_URL"
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" "$TARGET_URL" || echo "000")
          echo "HTTP Status Code: $HTTP_STATUS"
          cat response.json || true
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Warning: Health endpoint returned $HTTP_STATUS"
          else
            echo "Successfully pinged health check. Supabase is active!"
          fi

      - name: Direct Supabase REST Ping (Backup)
        if: env.SUPABASE_URL != '' && env.SUPABASE_KEY != ''
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          echo "Sending direct PostgREST ping to Supabase..."
          curl -s -f -X GET "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -o /dev/null -w "Supabase REST Status: %{http_code}\n" || echo "Direct ping completed"
